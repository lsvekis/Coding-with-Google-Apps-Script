    var oldTitle = document.title; document.title = 'Laporan Prestasi UTMXCITE ' + d.year + ' (slaid)';
    function done() { document.body.classList.remove('ps'); var x = document.getElementById('pgstyle'); if (x) x.remove(); host.innerHTML = ''; document.title = oldTitle; window.removeEventListener('afterprint', done); }
    window.addEventListener('afterprint', done);
    window.__slidesDone = done;
    window.print();
  }

  // ------------------------------------------------------------------ Admin: persediaan
  function renderSetup() {
    var el = $('#content');
    if (!S.setup) {
      el.innerHTML = '<p class="boot">Memuatkan…</p>';
      call('api_setupInfo', S.token).then(function (r) { S.setup = r; if (S.view.name === 'setup') renderSetup(); })
        .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
      return;
    }
    var i = S.setup;
    function row(label, val, url, note) {
      var v = val ? (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(val) + '</a>' : esc(val)) : '<span class="muted">(tiada)</span>';
      return '<tr><th scope="row">' + esc(label) + '</th><td style="word-break:break-all">' + v + (note ? '<div class="muted">' + esc(note) + '</div>' : '') + '</td><td>' +
        (val ? '<button class="btn o" data-action="copy" data-v="' + esc(val) + '">Salin</button>' : '') + '</td></tr>';
    }
    var h = '<div class="panel"><table><tbody>' +
      row('Google Sheet - ID', i.sheet && i.sheet.id) +
      row('Google Sheet - Pautan', i.sheet && i.sheet.url, i.sheet && i.sheet.url) +
      row('Web app - Pautan', i.webAppUrl, i.webAppUrl, i.isDevUrl ? 'Ini pautan ujian /dev. Kongsi pautan /exec daripada Deploy > Manage deployments.' : '') +
      row('Script ID', i.scriptId) +
      row('Folder lampiran - Pautan', i.folder && i.folder.url, i.folder && i.folder.url, i.folder ? '' : 'Dicipta automatik semasa muat naik PDF pertama.') +
      row('Pemilik skrip (Execute as)', i.owner) +
      '</tbody></table></div>' +
      '<div class="panel"><h3>Semakan sistem</h3><ul class="chk">';
    i.checks.forEach(function (c) {
      h += '<li data-ok="' + (c.ok === null ? 'na' : c.ok ? '1' : '0') + '">' + (c.ok === null ? '–' : c.ok ? '✓' : '✗') + ' ' + esc(c.label) + (c.detail ? '<div class="muted">' + esc(c.detail) + '</div>' : '') + '</li>';
    });
    h += '</ul><div class="acts"><button class="btn" data-action="runsetup">Jalankan persediaan</button> <button class="btn o" data-action="testmail">Hantar e-mel ujian</button></div>' +
      '<p class="muted">Maklumat sama juga ada dalam tab "Persediaan" di dalam Google Sheet. Jika paparan "404", pastikan guna pautan /exec, Execute as = Me, Who has access = Anyone, dan deploy New version selepas ubah kod.</p></div>';
    el.innerHTML = h;
  }
  function copyText(t) {
    function fb() { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Disalin.'); } catch (e) { toast('Tidak dapat menyalin.', true); } ta.remove(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast('Disalin.'); }, fb); else fb();
  }

  // ------------------------------------------------------------------ log masuk (OTP)

  function renderLogin() {
    var L = S.login;
    $('#app').innerHTML =
      '<div class="lgpage"><header class="lgban">' +
      (window.UTM_LOGO ? '<img src="' + window.UTM_LOGO + '" alt="Universiti Teknologi Malaysia ASCEND 2030">' : '') +
      '<div class="lgtt"><small>DS04 · Pekerjaan Premium Tier 1</small><b>' + esc(APP_NAME) + '</b><span>Dashboard KPI UTMXCITE JTNCHEPA</span></div></header>' +
      '<main class="lgmain"><div class="lgcard" role="dialog" aria-labelledby="ltitle">' +
      '<h2 id="ltitle">Log Masuk</h2>' +
      '<p>Masukkan e-mel berdaftar anda. Kod pengesahan enam digit akan dihantar melalui e-mel.</p>' +
      '<form id="lform" novalidate>' +
      '<label for="l_emel">E-mel berdaftar</label><input type="email" id="l_emel" autocomplete="email" placeholder="nama@utm.my" value="' + esc(L.email || '') + '">' +
      '<label for="l_code">Kod OTP</label><input type="text" id="l_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Masukkan kod 6 digit" value="' + esc(L.code || '') + '">' +
      (L.message ? '<div class="ok" role="status">' + esc(L.message) + '</div>' : '') +
      '<div class="err" role="alert">' + esc(L.error || '') + '</div>' +
      '<div class="lgacts"><button class="btn" type="button" data-action="sendotp"' + (L.busy ? ' disabled' : '') + '>' + (L.busy === 'send' ? 'Menghantar…' : 'Hantar / Hantar Semula Kod') + '</button>' +
      '<button class="btn" type="submit"' + (L.busy ? ' disabled' : '') + '>' + (L.busy === 'verify' ? 'Mengesahkan…' : 'Sahkan dan Log Masuk') + '</button></div>' +
      '<p class="lgback"><a href="#" data-action="lclose">← Kembali ke dashboard awam</a></p></form></div></main>' +
      '<footer class="lgfoot">© 2026 UTMXCITE, Universiti Teknologi Malaysia</footer></div>';
    var f = (L.message && $('#l_code')) || $('#l_emel'); if (f && !L.noFocus) f.focus();
  }
  function loginKeep() {   // simpan nilai medan sebelum lukis semula
    var L = S.login; if (!L) return;
    if ($('#l_emel')) L.email = $('#l_emel').value.trim();
    if ($('#l_code')) L.code = $('#l_code').value.trim();
  }

  function sendOtp() {
    var L = S.login; if (!L || L.busy) return;
    loginKeep(); L.error = ''; L.message = '';
    if (!L.email) { L.error = 'Sila masukkan e-mel.'; renderLogin(); return; }
    L.busy = 'send'; renderLogin();
    call('api_requestOtp', L.email).then(function (r) {
      L.busy = false; L.message = r.message || 'Kod OTP telah dihantar.'; renderLogin();
    }).catch(function (e) { L.busy = false; L.error = e.message; renderLogin(); });
  }

  function submitLogin() {
    var L = S.login; if (!L || L.busy) return;
    loginKeep(); L.error = '';
    if (!L.email) { L.error = 'Sila masukkan e-mel.'; renderLogin(); return; }
    if (!/^\d{6}$/.test(L.code || '')) { L.error = L.message ? 'Masukkan kod 6 digit.' : 'Tekan "Hantar Kod" dahulu, kemudian masukkan kod 6 digit.'; renderLogin(); return; }
    L.busy = 'verify'; renderLogin();
    call('api_verifyOtp', L.email, L.code).then(function (r) {
      S.token = r.token; store('set', 'utmx_token', r.token);
      S.login = null;
      return call('api_session', S.token);
    }).then(function (sess) {
      S.session = sess; S.view = { name: 'infografik' }; S.dash = null;
      toast('Selamat datang, ' + (sess.user.nama || sess.user.emel) + '.');
      render();
    }).catch(function (e) { L.busy = false; L.error = e.message; L.code = ''; renderLogin(); });
  }

  function doLogout() {
    var t = S.token;
    S.token = null; S.session = null; store('del', 'utmx_token');
    S.view = { name: 'infografik' }; S.list = S.users = S.targets = S.audit = null; S.editing = null; S.dash = null;
    if (t) call('api_logout', t).catch(function () {});
    toast('Anda telah log keluar.');
    render();
  }

  // ------------------------------------------------------------------ navigasi
  function go(target) {
    S.navOpen = false; S.editing = null; S.list = null; S.listFilters = {};
    var lvl = levelOf(target); if (lvl) S.open[lvl] = true;
    if (target === 'infografik') { S.view = { name: 'infografik' }; S.trend = null; S.dash = null; }
    else if (target === 'dashboard') { S.view = { name: 'dashboard' }; S.dash = null; } // muat semula supaya angka terkini dipaparkan
    else if (target.indexOf('kpi:') === 0) S.view = { name: 'kpi', id: target.slice(4), tab: 'list' };
    else { S.view = { name: target }; if (target === 'users') S.users = null; if (target === 'targets') S.targets = null; if (target === 'audit') S.audit = null; if (target === 'setup') S.setup = null; }
    render(); window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------------ peristiwa
  document.addEventListener('click', function (ev) {
    var nav = ev.target.closest('[data-nav]');
    if (nav) { go(nav.getAttribute('data-nav')); return; }
    var a = ev.target.closest('[data-action]');
    if (!a) return;
    var act = a.getAttribute('data-action');
    var k = S.view.name === 'kpi' ? kpiById(S.view.id) : null;
    switch (act) {
      case 'togglenav': S.navOpen = !S.navOpen; $('#side').classList.toggle('open', S.navOpen); $('.scrim').classList.toggle('open', S.navOpen); break;
      case 'tg':
        var gid = a.getAttribute('data-g');
        if (S.mini) { S.mini = false; S.open[gid] = true; } else S.open[gid] = !isOpen(gid);
        redrawSide(); break;
      case 'collapse':
        if (window.innerWidth <= 860) { S.navOpen = false; $('#side').classList.remove('open'); $('.scrim').classList.remove('open'); }
        else { S.mini = !S.mini; redrawSide(); }
        break;
      case 'closenav': S.navOpen = false; $('#side').classList.remove('open'); $('.scrim').classList.remove('open'); break;
      case 'login': S.login = { email: '' }; renderLogin(); break;
      case 'sendotp': sendOtp(); break;
      case 'lclose': ev.preventDefault(); S.login = null; render(); break;
      case 'logout': doLogout(); break;
      case 'dview': S.dashView = a.getAttribute('data-view'); renderDashboard(); break;
      case 'padd':
        var pk = a.getAttribute('data-key'), pfd = k && fieldDef(k, pk);
        syncPeople(pk);
        if (!S.people[pk]) S.people[pk] = [];
        if (pfd && pfd.max && S.people[pk].length >= pfd.max) { toast('Maksimum ' + pfd.max + ' ' + (pfd.noun || 'pelajar') + '.', true); break; }
        S.people[pk].push({ nama: '', matrik: '', nokp: '', fakulti: '' }); redrawPeople(pk); break;
      case 'pdel': syncPeople(a.getAttribute('data-key')); S.people[a.getAttribute('data-key')].splice(parseInt(a.getAttribute('data-i'), 10), 1); redrawPeople(a.getAttribute('data-key')); break;
      case 'fdl': if (k) downloadPdf(k, a.getAttribute('data-id'), a.getAttribute('data-key')); break;
      case 'tab': S.view.tab = a.getAttribute('data-tab'); if (S.view.tab === 'list') S.editing = null; renderKpi(); break;
      case 'msync': runMsync(); break;
      case 'stucancel': S.modal = null; drawStudentModal(); break;
      case 'bulkstu': bulkCompleteStudents(kpiById(S.view.id)); break;
      case 'bulkdl': downloadTemplate(kpiById(S.view.id)); break;
      case 'bulkgo': runBulk(kpiById(S.view.id)); break;
      case 'bulkerr': downloadBulkErrors(kpiById(S.view.id)); break;
      case 'bulkreset': S.bulk = null; renderKpi(); break;
      case 'new': S.editing = null; S.view.tab = 'form'; renderKpi(); break;
      case 'cancelform': S.editing = null; S.view.tab = 'list'; renderKpi(); break;
      case 'edit':
        S.editing = (S.list.rows.filter(function (r) { return r.id === a.getAttribute('data-id'); })[0]) || null;
        S.view.tab = 'form'; renderKpi(); window.scrollTo(0, 0); break;
      case 'del':
        if (k) {
          var rid = a.getAttribute('data-id');
          askConfirm('Padam rekod ' + rid + '? Tindakan ini tidak boleh dibatalkan.', 'Ya, padam').then(function (yes) {
            if (!yes) return;
            call('api_delete', S.token, k.id, rid).then(function () { toast('Rekod dipadam.'); S.list = null; renderList(k); })
              .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
          });
        }
        break;
      case 'uedit':
        var u = S.users.filter(function (x) { return x.emel === a.getAttribute('data-email'); })[0];
        if (u) {
          $('#u_emel').value = u.emel; $('#u_nama').value = u.nama; $('#u_peranan').value = u.peranan;
          $('#u_fakulti').value = u.fakulti; $('#u_akses').value = u.kpi_akses; $('#u_aktif').value = u.aktif;
          window.scrollTo(0, 0);
        }
        break;
      case 'uclear': $('#uform').reset(); break;
      case 'copy': copyText(a.getAttribute('data-v')); break;
      case 'logoutall':
        askConfirm('Log keluar daripada SEMUA peranti dan pelayar? Anda perlu OTP baharu untuk log masuk semula.', 'Ya, log keluar semua').then(function (yes) {
          if (!yes) return;
          call('api_logoutAll', S.token).then(function () { S.token = null; S.session = null; store('del', 'utmx_token'); doLogout(); }).catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        });
        break;
      case 'slides': printSlides(); break;
      case 'print':   // tajuk dokumen (dan nama fail PDF) = Laporan Prestasi UTMXCITE
        var oldTitle = document.title; document.title = 'Laporan Prestasi UTMXCITE' + (S.dash ? ' ' + S.dash.year : '');
        window.print(); document.title = oldTitle; break;
      case 'runsetup':
        askConfirm('Jalankan persediaan semula? Tab/lajur yang tiada akan ditambah; data sedia ada tidak dipadam.', 'Ya, jalankan').then(function (yes) {
          if (!yes) return;
          call('api_runSetup', S.token).then(function () { toast('Persediaan selesai.'); S.setup = null; renderSetup(); })
            .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        });
        break;
      case 'testmail':
        call('api_testMail', S.token).then(function (r) { toast('E-mel ujian dihantar ke ' + r.to + '.'); })
          .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        break;
      case 'udel':
        var em = a.getAttribute('data-email');
        askConfirm('Padam pengguna ' + em + '?', 'Ya, padam').then(function (yes) {
          if (!yes) return;
          call('api_deleteUser', S.token, em).then(function () { toast('Pengguna dipadam.'); S.users = null; renderUsers(); })
            .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        });
        break;
      case 'tsave':
        var i = parseInt(a.getAttribute('data-i'), 10), t = S.targets[i], row = { kpi: t.kpi, tahun: t.tahun };
        $$('[data-t="' + i + '"]').forEach(function (inp) { row[inp.getAttribute('data-k')] = inp.value; });
        call('api_saveTarget', S.token, row).then(function () { toast('Sasaran ' + t.kpi + ' ' + t.tahun + ' disimpan.'); S.dash = null; S.targets = null; renderTargets(); })
          .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        break;
    }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var id = ev.target.id;
    if (id === 'kform') submitForm();
    else if (id === 'stuform') saveStudentModal();
    else if (id === 'lform') submitLogin();
    else if (id === 'uform') {
      var rec = { emel: $('#u_emel').value, nama: $('#u_nama').value, peranan: $('#u_peranan').value, fakulti: $('#u_fakulti').value, kpi_akses: $('#u_akses').value, aktif: $('#u_aktif').value };
      call('api_saveUser', S.token, rec).then(function () { toast('Pengguna disimpan.'); S.users = null; renderUsers(); })
        .catch(function (e) { if (authFail(e)) return; showFieldErrors(e.fields); toast(e.message, true); });
    }
  });

  document.addEventListener('change', function (ev) {
    if (ev.target.id && ev.target.id.indexOf('f_') === 0 && S.view.name === 'kpi') { var ak = kpiById(S.view.id); if (ak) applyAutofill(ak, ev.target.id.slice(2)); }
    var tg = ev.target, kk2 = S.view.name === 'kpi' ? kpiById(S.view.id) : null;
    if (kk2 && ((kk2.student && tg.id === 'f_' + kk2.student.matrik) || tg.getAttribute('data-pf') === 'matrik')) { onMatrikChange(kk2, tg); }
    var c = ev.target.getAttribute && ev.target.getAttribute('data-change');
    if (!c) return;
    if (c === 'fupload') { var kk = kpiById(S.view.id); if (kk) uploadPdf(kk, ev.target.getAttribute('data-key'), ev.target.files && ev.target.files[0]); return; }
    if (c === 'bulkfile') { var bk = kpiById(S.view.id); if (bk) readBulkFile(bk, ev.target.files && ev.target.files[0]); return; }
    if (c === 'year') { S.dash = null; loadDashboard(parseInt(ev.target.value, 10)); }
    if (c === 'iyear') { S.dash = null; loadInfo(parseInt(ev.target.value, 10)); }
    if (c === 'fstatus') { S.listFilters.status = ev.target.value; S.list = null; renderKpi(); }
    if (c === 'fstatus2') { S.listFilters.status2 = ev.target.value; S.list = null; renderKpi(); }
    if (c === 'ffak') { S.listFilters.fakulti = ev.target.value; S.list = null; renderKpi(); }
  });

  var qTimer = null;
  document.addEventListener('input', function (ev) {
    if (ev.target.getAttribute && ev.target.getAttribute('data-input') === 'q') {
      var val = ev.target.value;
      clearTimeout(qTimer);
      qTimer = setTimeout(function () {
        S.listFilters.q = val; S.list = null; var k = kpiById(S.view.id);
        if (k) { call('api_list', S.token, k.id, S.listFilters).then(function (r) { S.list = r; var el = $('#q'); var pos = el ? el.selectionStart : 0; renderList(k); el = $('#q'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }); }
      }, 300);
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (S.login) { S.login = null; render(); }
      else if (S.navOpen) { S.navOpen = false; render(); }
    }
  });

  // ------------------------------------------------------------------ mula
  function boot() {
    var t = store('get', 'utmx_token');
    if (!t) { render(); return; }
    S.token = t;
    call('api_session', t).then(function (sess) { S.session = sess; render(); })
      .catch(function () { S.token = null; store('del', 'utmx_token'); render(); });
  }
  boot();
})();
</script>

<script>/* Kawalan demo (demo/demo-ui.js) */
/** Kawalan demo: log masuk pantas, e-mel OTP simulasi, panduan dan set semula data. */
(function () {
  'use strict';
  var css = document.createElement('style');
  css.textContent =
    '#demobar{position:fixed;right:12px;bottom:12px;z-index:60;background:#2b1a1f;color:#fff;border-radius:12px;box-shadow:0 4px 18px #0005;font:12.5px/1.4 "Segoe UI",Roboto,Arial,sans-serif;max-width:min(92vw,560px)}' +

    '#demobar p{margin:8px 0 6px;color:#ffffffcc}' +

    '#demobar button.o{background:transparent;color:#fff;border:1px solid #ffffff66;font-weight:500}' +
    '#demobar button:hover{filter:brightness(.92)}' +
    '#demomail{position:fixed;right:12px;top:72px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:min(92vw,340px)}' +
    '#demomail .m{background:#fff;color:#2b1a1f;border:1px solid #e3d9dc;border-left:5px solid #5c0f2a;border-radius:10px;box-shadow:0 4px 18px #0004;padding:10px 12px;font:13px/1.45 "Segoe UI",Roboto,Arial,sans-serif}' +
    '#demomail .m b.code{display:block;font-size:26px;letter-spacing:6px;color:#5c0f2a;margin:4px 0}' +
    '#demomail .m small{color:#6a5a5f}' +
    '#demomail .m button{margin-top:6px;margin-right:6px;border:1px solid #5c0f2a;background:#fff;color:#5c0f2a;border-radius:6px;padding:4px 9px;font:inherit;cursor:pointer}' +
    '#demomodal{position:fixed;inset:0;background:#0007;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}' +
    '#demomodal .dlg{background:#fff;color:#2b1a1f;border-radius:12px;padding:20px 22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;font:14px/1.5 "Segoe UI",Roboto,Arial,sans-serif}' +
    '#demomodal h2{color:#5c0f2a;font-size:18px;margin:0 0 8px}#demomodal ol{padding-left:20px;margin:8px 0}#demomodal li{margin:5px 0}' +
    '#demomodal button{margin-top:10px;background:#5c0f2a;color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;cursor:pointer}';
  document.head.appendChild(css);

  var bar = document.createElement('div');
  bar.id = 'demobar';
  bar.innerHTML = '<div class="dh" role="button" tabindex="0" aria-expanded="false"><span class="tag">PROTOTAIP PRA-DEMO</span><span>Data contoh sahaja · bukan sistem sebenar</span><span style="margin-left:auto">▲</span></div>' +
    '<div class="db"><p>Log masuk pantas (tanpa OTP) atau cuba log masuk biasa: kod OTP simulasi akan muncul di kanan bawah.</p>' +
    '<div class="row"><button data-d="admin.demo@utm.my">Admin</button><button data-d="pic.fai@utm.my">PIC Fakulti AI</button><button data-d="pic.fc@utm.my">PIC Fakulti Komputeran</button><button class="o" data-d="">Awam (log keluar)</button></div>' +
    '<p>Data yang anda masukkan disimpan dalam pelayar ini sahaja.</p>' +
    '<div class="row"><button class="o" data-a="guide">Panduan demo</button><button class="o" data-a="reset">Set semula data contoh</button></div></div>';
  document.body.appendChild(bar);
  var head = bar.querySelector('.dh');
  function toggle() { var o = bar.classList.toggle('open'); head.setAttribute('aria-expanded', String(o)); head.lastChild.textContent = o ? '▼' : '▲'; }
  head.addEventListener('click', toggle);
  head.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-d')) {
      var email = b.getAttribute('data-d');
      try {
        if (!email) { localStorage.removeItem('utmx_token'); sessionStorage.removeItem('utmx_token'); }
        else { var tok = randomHex_(48); CacheService.getScriptCache().put('sess:' + sha256Hex_(tok), email, APP.SESSION_TTL); localStorage.setItem('utmx_token', tok); }
      } catch (err) { /* abaikan */ }
      window.__demoPersistNow(); location.reload();
    } else if (b.getAttribute('data-a') === 'reset') {
      if (confirm('Set semula semua data contoh? Perubahan anda akan hilang.')) { window.__demoReset(); location.reload(); }
    } else if (b.getAttribute('data-a') === 'guide') { showGuide(); }
  });

  function showGuide() {
    var m = document.createElement('div'); m.id = 'demomodal';
    m.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><h2>Cadangan aliran demo (10 minit)</h2><ol>' +
      '<li><b>Dashboard awam:</b> tanpa log masuk. Tukar tahun dan tukar paparan <i>Mengikut peringkat / Mengikut fungsi</i> (enam fungsi UTMXCITE). Buka "Butiran" pada beberapa kad.</li>' +
      '<li><b>Log masuk OTP:</b> tekan Log Masuk, masukkan <code>pic.fai@utm.my</code>. Kod OTP simulasi muncul di kanan bawah.</li>' +
      '<li><b>PIC Fakulti AI:</b> sidebar hanya menunjukkan KPI yang dibenarkan. Buka <i>CKAI 1 Profiling</i> dan tambah satu profil.</li>' +
      '<li><b>Daftar program (CKAI 2/3):</b> tambah program Selesai dan lihat medan wajib (tarikh, tempat, penyertaan, kos, pendapatan).</li>' +
      '<li><b>Anugerah (CKAI 9):</b> tambah beberapa pelajar, muat naik sijil PDF, kemudian muat turun semula.</li>' +
      '<li><b>Inovasi pelajar (CKAI 8):</b> tapis "Status peningkatan = Calon peningkatan" untuk melihat projek yang boleh dibawa ke peringkat lebih tinggi.</li>' +
      '<li><b>Sekatan akses:</b> PIC tidak boleh membuka CKAI 4 / 5 / 6 atau data fakulti lain.</li>' +
      '<li><b>Admin:</b> tukar ke Admin. Tunjukkan Urus Pengguna, Sasaran (isi sasaran CKAI) dan Log Audit.</li>' +
      '<li><b>Kembali ke dashboard awam:</b> angka dikemas kini serta-merta; tiada nama atau data peribadi dipaparkan.</li></ol>' +
      '<p style="color:#6a5a5f;font-size:12.5px">Semua nama, no. matrik dan no. KP dalam prototaip ini adalah rekaan. Sasaran CKAI hanyalah contoh.</p><button>Tutup</button></div>';
    m.addEventListener('click', function (e) { if (e.target === m || e.target.tagName === 'BUTTON') m.remove(); });
    document.body.appendChild(m);
  }

  // E-mel OTP simulasi
  var box = document.createElement('div'); box.id = 'demomail'; document.body.appendChild(box);
  window.__demoMail = function (mail) {
    var code = (/(\d{6})/.exec(mail.body || '') || [])[1] || '';
    var d = document.createElement('div'); d.className = 'm';
    d.innerHTML = '<small>E-mel simulasi kepada <b></b></small><b class="code"></b><small>Sah 5 minit. Dalam sistem sebenar kod ini dihantar melalui e-mel.</small><br><button data-c>Salin kod</button><button data-x>Tutup</button>';
    d.querySelector('small b').textContent = mail.to;
    d.querySelector('.code').textContent = code;
    if (!code) { d.querySelector('.code').textContent = 'E-mel ujian'; }
    d.addEventListener('click', function (e) {
      if (e.target.hasAttribute('data-c')) { try { navigator.clipboard.writeText(code); e.target.textContent = 'Disalin'; } catch (err) { /* abaikan */ } }
      if (e.target.hasAttribute('data-x')) d.remove();
    });
    box.appendChild(d);
    setTimeout(function () { d.remove(); }, 90000); // hilang sendiri supaya tidak menutup UI
    var inp = document.getElementById('l_code'); if (inp) setTimeout(function () { var i2 = document.getElementById('l_code'); if (i2) i2.placeholder = code; }, 300);
  };
  // Kotak e-mel hilang apabila dialog log masuk ditutup (log masuk berjaya atau dibatal)
  var modalHost = document.getElementById('modal') || document.getElementById('app');
  new MutationObserver(function () {
    var m = document.getElementById('modal');
    if (m && !m.firstChild) box.innerHTML = '';
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
