<!DOCTYPE html>
<html lang="ms">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><?= appName ?></title>
  <style>
:root{--m:#5c0f2a;--m2:#7a1a3d;--gold:#e9b949;--bg:#f4f1ee;--card:#fff;--ink:#2b1a1f;--mut:#6a5a5f;--line:#e3d9dc;
--ok:#1f6f6b;--warn:#b45f06;--bad:#b3261e;--over:#2e7d32;--info:#3b78d8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.boot{padding:40px;text-align:center;color:var(--mut)}
.shell{display:flex;min-height:100vh}
.side{width:264px;flex:none;background:#fff;color:var(--ink);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .18s}
.sh{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.hb{flex:none;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.hb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hb:hover{background:#f6eef1}
.shlogo{height:58px;width:auto;flex:none;display:block}
.shname{min-width:0;line-height:1.25}
.shname b{display:block;font-size:12.5px;color:var(--m)}
.shname small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px}
.sbody{padding:4px 8px 16px;display:flex;flex-direction:column;gap:2px}
.prof{margin:6px 6px 8px;background:#faf5f6;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--m);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.prof b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof small{font-size:11px;color:var(--mut);word-break:break-all}
.mod{font-size:11px;letter-spacing:1.2px;color:#8a7f83;padding:14px 12px 6px;font-weight:600;text-transform:uppercase;line-height:1.35}
.ic{flex:none;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gh,.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;font-size:14px;cursor:pointer;border-radius:8px;font-weight:500}
.gh:hover,.nav:hover{background:#f6eef1}
.gh:focus-visible,.nav:focus-visible,.hb:focus-visible{outline:2px solid var(--m);outline-offset:1px}
.gh .lb{flex:1}
.cv{flex:none;width:18px;height:18px;transition:transform .15s;color:#6a5a5f}
.cv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gh[aria-expanded=true] .cv{transform:rotate(180deg)}
.gh.has-act{color:var(--m)}
.gb{display:flex;flex-direction:column;gap:1px;padding:2px 0 6px 20px;margin-left:11px;border-left:1px solid var(--line)}
.gb[hidden]{display:none}
.gb .nav{font-size:13px;font-weight:400;padding:7px 10px;gap:8px;color:#4a3a3f}
.gb .nav .dot{flex:none;width:6px;height:6px;border-radius:50%;background:#cdbfc3}
.nav.act{background:#f3e3e8;color:var(--m);font-weight:600}
.gb .nav.act .dot{background:var(--m)}
.nav .lb{flex:1;min-width:0}
.side.mini{width:68px}
.side.mini .shlogo,.side.mini .shname,.side.mini .lb,.side.mini .cv,.side.mini .mod,.side.mini .gb,.side.mini .stagelbl,.side.mini .prof>div:not(.av){display:none}
.side.mini .sh{justify-content:center;padding:14px 0 10px}
.side.mini .gh,.side.mini .nav{justify-content:center;padding:10px 0}
.side.mini .prof{justify-content:center;padding:8px 0;background:none;border:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.tt{display:flex;gap:10px;align-items:center;min-width:0}
.top h1{font-size:19px;color:var(--m);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:18px;cursor:pointer}
.user{display:flex;gap:10px;align-items:center;font-size:12.5px}
.badge{background:#e9b94933;color:#7a5400;padding:3px 9px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn{background:var(--m);color:#fff;border:1px solid var(--m);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--m2)}
.btn.o{background:#fff;color:var(--m)}
.btn.o:hover{background:#f6eef1}
.btn.d{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.tabs{background:#fff;padding:0 24px;display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:11px 18px;font-size:13.5px;color:#666;cursor:pointer;border-bottom:3px solid transparent}
.tab.act{color:var(--m);font-weight:700;border-bottom-color:var(--m)}
.cont{padding:22px 24px;max-width:1280px;width:100%}
.pub{background:#fff7e0;border:1px dashed var(--gold);padding:7px 12px;font-size:12.5px;border-radius:6px;margin-bottom:16px}
.bar-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar-top .grow{flex:1}
select,input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=month],input[type=url],textarea{border:1px solid #cdbfc3;border-radius:6px;padding:8px 10px;background:#fff;width:100%;min-height:36px}
textarea{min-height:76px;resize:vertical}
.bar-top select,.bar-top input{width:auto;min-width:140px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--m)}
.sumrow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.ds{background:var(--m);color:#fff;border-radius:10px;padding:12px 16px;flex:1;min-width:240px}
.ds b{color:var(--gold);font-size:22px;display:block}
.ds span{font-size:12px;opacity:.85}
.ds.prem{background:#2b1a1f}
.pbar{height:6px;background:#ffffff33;border-radius:3px;margin:6px 0;overflow:hidden}.pbar i{display:block;height:100%;background:var(--gold)}
.grp{font-size:13px;font-weight:700;color:var(--m);margin:20px 0 10px;text-transform:uppercase;letter-spacing:.8px}
.seg{display:inline-flex;border:1px solid #cdbfc3;border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--m)}
.seg button.on{background:var(--m);color:#fff;font-weight:600}
.subms{font-weight:400;color:var(--mut);font-size:11.5px}
.grpms{display:block;text-transform:none;letter-spacing:0;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
.sub{font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.sub:before{content:"";width:14px;height:2px;background:var(--gold);display:inline-block}
.stagelbl{font-size:10px;letter-spacing:.8px;color:#8a7f83;padding:8px 10px 2px;text-transform:uppercase;line-height:1.3}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.kcard{background:var(--card);border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px #0001;display:flex;flex-direction:column;gap:6px}
.kcard .t{font-size:12.5px;color:var(--mut);min-height:34px}
.kcard .v{font-size:27px;font-weight:700;color:var(--m);line-height:1.1}
.kcard .v small{font-size:13px;font-weight:400;color:var(--mut)}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:9px;color:#fff;font-weight:600;align-self:flex-start}
.tag.Growth{background:var(--ok)}.tag.Transform{background:var(--warn)}.tag.Department{background:var(--info)}.tag.Center{background:#6b4e9b}.tag.KPT{background:#b8860b}
.track{position:relative;height:9px;background:#eadfe2;border-radius:5px;margin:4px 0 2px;overflow:visible}
.track .f{position:absolute;left:0;top:0;bottom:0;background:var(--m);border-radius:5px 0 0 5px}
.track .x{position:absolute;top:0;bottom:0;background:var(--gold);border-radius:0 5px 5px 0}
.track .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:#2b1a1f}
.chip{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:10px;font-weight:600;border:1px solid transparent}
.chip.below{background:#fff3e0;color:#8a4b00;border-color:#f0cf9e}
.chip.meet{background:#e3f4f2;color:#14524f;border-color:#a9d9d4}
.chip.over{background:#e6f4e7;color:#1b5e20;border-color:#a8d5ab}
.chip.none{background:#eee;color:#555}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sec2{font-size:12px;color:var(--mut)}
.sec2 b{color:var(--ink)}
.warn{font-size:12px;background:#fdecea;color:var(--bad);border-radius:6px;padding:5px 8px}
details.bd summary{cursor:pointer;color:var(--m);font-size:12.5px;font-weight:600;margin-top:2px}
.bd h4{font-size:12px;margin:10px 0 4px;color:var(--mut)}
.bi{display:grid;grid-template-columns:minmax(80px,1.3fr) 2fr auto;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.bi .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi.long{grid-template-columns:1fr auto;row-gap:2px}.bi.long .l{white-space:normal;grid-column:1/-1}.bi.long .mini{grid-column:1}.bi.long .n{grid-column:2}
.bi .mini{height:6px;background:#eadfe2;border-radius:3px;overflow:hidden}
.bi .mini i{display:block;height:100%;background:var(--m2)}
.bi .n{font-variant-numeric:tabular-nums;color:var(--mut)}
.muted{color:#6a5a5f;font-size:12.5px}
.chk{list-style:none;margin:8px 0;padding:0}.chk li{padding:4px 0}.chk li[data-ok="0"]{color:#a4132f}.chk li[data-ok="1"]{color:#18703a}
.panel h3{margin:12px 14px 0}.panel .acts{margin:10px 14px}.panel>p{margin:8px 14px 12px}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 3px #0001;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f0e7ea;text-align:left;padding:6px 8px;font-size:11.5px;color:var(--m);white-space:nowrap;position:sticky;top:0}
td{padding:6px 8px;border-top:1px solid #eee;vertical-align:top}
table.lst td{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.lst td.act,table.lst td.empty{max-width:none}
td.act{white-space:nowrap;text-align:right}
td.empty{text-align:center;color:var(--mut);padding:30px}
.form{background:#fff;border-radius:10px;box-shadow:0 1px 3px #0001;padding:18px 20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.fgrid .full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}
label{font-size:12px;font-weight:600;color:var(--m);display:block;margin-bottom:4px}
label .req{color:var(--bad)}
.err{color:var(--bad);font-size:12px;margin-top:3px}
.invalid input,.invalid select,.invalid textarea{border-color:var(--bad)}
.hint{font-size:11.5px;color:var(--mut);margin-top:3px}
.acts{margin-top:18px;display:flex;gap:10px}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:400px}
.dlg h2{color:var(--m);font-size:18px;margin-bottom:6px}
.dlg p{color:var(--mut);font-size:13px;margin-bottom:14px}
.dlg .acts{margin-top:14px}
.lgpage{min-height:100vh;display:flex;flex-direction:column;background:#f4f4f4}
.lgban{background:linear-gradient(100deg,#fff 0%,#fbeef2 55%,#f3d9e1 100%);border-bottom:6px solid #e9e9e9;display:flex;align-items:center;justify-content:center;gap:28px;padding:22px 20px;flex-wrap:wrap;text-align:left}
.lgban img{height:84px;max-width:100%}
.lgtt{display:flex;flex-direction:column;gap:2px}
.lgtt small{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.lgtt b{font-size:28px;line-height:1.15;color:var(--m);font-weight:800}
.lgtt span{font-size:15px;font-weight:600;color:#1c2a5e}
.lgmain{flex:1;display:flex;justify-content:center;padding:28px 16px}
.lgcard{background:#fff;border:1px solid #dde1e6;border-radius:14px;padding:28px 18px;width:100%;max-width:468px;height:fit-content;text-align:center}
.lgcard h2{color:var(--m);font-size:22px;margin-bottom:8px}
.lgcard p{color:#2b1a1f;font-size:14px;margin-bottom:14px}
.lgcard label{text-align:center;font-size:14px;color:#111;margin:12px 0 6px}
.lgcard input{text-align:left}
.lgcard .ok{color:var(--good,#18703a);font-size:13px;margin-top:10px}
.lgacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.lgcard .lgback{margin:16px 0 0;font-size:13px}
.lgback a{color:var(--m)}
.lgfoot{text-align:center;color:var(--mut);font-size:13px;padding:22px 16px 28px}
@media(max-width:600px){.lgban{flex-direction:column;text-align:center}.lgtt b{font-size:22px}.lgban img{height:64px}}
.igtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.igh{color:var(--m);font-size:24px}.igs{color:var(--mut);font-size:12.5px;margin-top:2px}
.igctl{display:flex;gap:8px;align-items:center}
.ig{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.igp{background:#fff;border:1px solid #e6d3da;border-radius:14px;padding:16px;min-width:0}
.igp.c6{grid-column:span 6}.igp.c4{grid-column:span 4}.igp.c8{grid-column:span 8}.igp.c12{grid-column:span 12}
.igt2{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:12px 0 4px}
.igt{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--m);margin-bottom:10px}
.ring{width:100%;max-width:150px;display:block;margin:0 auto}
.rv{font-weight:700;fill:var(--ink)}
.prem2{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.prem2 .ring{max-width:150px;flex:none}
.pt{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);min-width:140px;flex:1}.pt b{font-size:26px;color:var(--ink)}.pt .gold{color:#8a6410;font-weight:600}
.rrow{display:flex;gap:10px;justify-content:space-around}.rrow:not(.six) .rtile{flex:1 1 0}.rrow.six{display:grid;grid-template-columns:repeat(6,1fr)}.rrow.four{display:grid;grid-template-columns:repeat(2,1fr);row-gap:14px}
.rtile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}.rtile .ring{max-width:104px}.rrow.six .ring{max-width:88px}
.rtile b{font-size:12.5px;color:var(--ink)}.rtile i{font-size:11px;color:var(--mut);font-style:italic}.rtile small{font-size:11px;color:var(--mut)}
.bigs{display:flex;gap:16px;justify-content:space-between}.bigs div{display:flex;flex-direction:column}.bigs b{font-size:30px;color:var(--m);line-height:1.1}.bigs b small{font-size:15px;color:var(--mut);font-weight:400}.bigs span{font-size:12px;color:var(--mut)}
.pbar2{height:6px;background:var(--track,#efe6e9);border-radius:3px;margin:8px 0 4px;overflow:hidden}.pbar2 i{display:block;height:100%;background:var(--m);border-radius:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;min-width:0}.tile b{font-size:28px;color:var(--m);line-height:1.1}.tile span{font-size:12.5px;color:var(--ink)}.tile small{font-size:11px;color:var(--mut)}
.big1{font-size:24px;font-weight:700;color:var(--m);margin-bottom:2px}.big1 small{font-size:12px;font-weight:400;color:var(--mut)}
.chart{width:100%;height:auto;display:block}.chart .ax{font-size:9.5px;fill:var(--mut)}.chart .av{font-size:10px;font-weight:600;fill:var(--ink)}
.klist{display:flex;flex-direction:column;gap:6px}.kl{display:grid;grid-template-columns:minmax(170px,1.1fr) 1.6fr 190px 120px;gap:10px;align-items:center;font-size:12.5px}
.kl .kn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kl .mini{height:6px;background:#efe6e9;border-radius:3px;overflow:hidden}.kl .mini i{display:block;height:100%;background:var(--m)}.kl .n{text-align:right;color:var(--mut)}
.eqbars .bi .l{white-space:normal;overflow:visible;text-overflow:clip}.eqbars .bi{grid-template-columns:minmax(210px,1.5fr) 3fr auto;font-size:13.5px;margin:9px 0}.eqbars .bi .mini{height:12px}.eqbars .bi .n{font-weight:700;white-space:nowrap}
.tbrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}.tbd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}.tbd .ring{max-width:130px}.tbd b{font-size:14px}.tbd span{font-size:12px;color:var(--mut)}.tbd small{font-size:11px;color:var(--mut)}
.igctl .pbtn{flex:0 0 118px;width:118px;min-width:118px;box-sizing:border-box;height:34px;padding:0 8px;white-space:nowrap;text-align:center}
.lnk{background:none;border:0;color:var(--mut);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0 0 0 2px;margin:-6px 0 8px;text-align:left}.lnk:hover{color:var(--m)}
.kptg{margin:4px 0 14px}.kpth{margin:0 0 8px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.kptn{background:#b8860b;color:#fff;border-radius:9px;padding:2px 9px;font-size:11px}
.kptc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpti{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;border:1px solid #efe1e6;border-radius:12px;padding:10px 8px;min-width:0}
.kpti .ring{max-width:92px}.kpti b{font-size:12.5px}.kptt{font-size:11.5px;color:var(--ink)}.kpti small{font-size:11px;color:var(--mut)}
@media(max-width:1000px){.igp.c6{grid-column:span 12}.igp.c4{grid-column:span 6}.igp.c8{grid-column:span 12}.rrow.six{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.igp.c4,.igp.c6,.igp.c8,.igp.c12{grid-column:span 12}.tiles{grid-template-columns:repeat(2,1fr)}.kl{grid-template-columns:1fr auto}.kl .mini{grid-column:1/-1;order:3}}

/* kulit */
.slide.cover{background:#fff linear-gradient(115deg,#fff 0%,#f6f3f3 38%,#fff 55%,#f1eded 78%,#fff 100%);border-top:0}
.slide.cover::before{content:"";position:absolute;left:-120px;bottom:-200px;width:700px;height:520px;background:linear-gradient(135deg,rgba(235,230,230,.7),rgba(255,255,255,0));transform:rotate(-24deg)}
.slide.cover::after{content:"";position:absolute;left:380px;top:120px;width:640px;height:420px;background:linear-gradient(135deg,rgba(240,236,236,.8),rgba(255,255,255,0));transform:rotate(-24deg)}
.slide .cv-art{position:absolute;right:-20px;top:-10px;width:520px;height:360px;z-index:1}
.slide .cv-in{position:relative;z-index:2;padding:62px 90px 0}
.slide .cv-sulit{display:block;font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--m);margin-bottom:22px}
.slide .cv-logos{display:flex;align-items:center;gap:24px;height:92px;margin-bottom:34px}.slide .cv-logos img{display:block;width:auto}.slide .lg-utm,.slide .lg-asc{height:92px}.slide .lg-xc{height:80px}.slide .lg-sep{width:2px;height:68px;background:#d9c9ce;display:block}
.slide.cover h1{font-size:76px;line-height:1.02;margin:0;color:#5c0f2a;font-weight:900;letter-spacing:-.01em}
.slide .cv-line{width:540px;height:3px;background:#5c0f2a;margin:34px 0 20px}
.slide .cv-by{font-size:21px;line-height:1.5;color:#2b1a1f;margin:0}.slide .cv-by b{font-weight:800}

  <script>
(function () {
  'use strict';

  var APP_NAME = 'UTMXCITE 4 ASCEND 2030 Report';
  var DASH_TITLE = 'Dashboard KPI UTMXCITE JTNCHEPA';
  var S = {
    token: null, session: null,
    view: { name: 'infografik' },
    year: null, dash: null,
    list: null, listFilters: {}, editing: null,
    users: null, targets: null, audit: null,
    navOpen: false, login: null, busy: false,
    people: {}, files: {}, peopleKp: {}, dashView: 'level', open: {}, mini: false
  };

  // ------------------------------------------------------------------ utiliti
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Log masuk berterusan: token disimpan dalam localStorage (kekal selepas pelayar ditutup) sehingga log keluar.
  // Jika localStorage disekat, guna sessionStorage; jika tiada storan, memori sahaja.
  function store(op, key, val) {
    var out = null;
    ['localStorage', 'sessionStorage'].forEach(function (kind, i) {
      try {
        var st = window[kind];
        if (op === 'get') { if (out === null) { var v = st.getItem(key); if (v !== null) out = v; } }
        else if (op === 'set') { if (i === 0) { st.setItem(key, val); } else { st.removeItem(key); } }
        else if (op === 'del') st.removeItem(key);
      } catch (e) { /* storan tidak tersedia */ }
    });
    if (op === 'set') { try { if (window.localStorage.getItem(key) !== val) window.sessionStorage.setItem(key, val); } catch (e) { try { window.sessionStorage.setItem(key, val); } catch (e2) { /* memori sahaja */ } } }
    return out;
  }
  function toast(msg, bad) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, 3800);
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var run = google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) return resolve(r.data);
          var e = new Error((r && r.error) || 'Ralat tidak diketahui.');
          e.fields = r && r.fields; e.missing = r && r.missing; e.auth = r && r.auth;
          reject(e);
        })
        .withFailureHandler(function (err) { reject(new Error((err && err.message) || 'Ralat rangkaian. Cuba lagi.')); });
      run[fn].apply(run, args);
    });
  }
  function authFail(e) {
    if (e && e.auth) {
      S.token = null; S.session = null; store('del', 'utmx_token');
      S.view = { name: 'infografik' };
      toast(e.message, true);
      render();
      return true;
    }
    return false;
  }
  function fmtNum(n) { return (Math.round(n * 10) / 10).toString(); }
  function initials(name, email) {
    var s = (name || email || '?').trim().split(/\s+/);
    return ((s[0] || '?').charAt(0) + (s.length > 1 ? s[s.length - 1].charAt(0) : '')).toUpperCase();
  }
  function kpiById(id) {
    var k = (S.session && S.session.kpis || []).filter(function (x) { return x.id === id; });
    return k[0] || null;
  }
  function fnById(list, id) { return (list || []).filter(function (x) { return x.id === id; })[0] || null; }
  function fnLabel(f) { return (f.no ? f.no + ' · ' : '') + f.label; }
  function isAdmin() { return S.session && S.session.user.peranan === 'Admin'; }

  // Dialog pengesahan dalam halaman (window.confirm mungkin disekat dalam iframe kotak pasir).
  function askConfirm(message, okLabel) {
    return new Promise(function (resolve) {
      var box = $('#confirm');
      box.innerHTML = '<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="ctitle"><div class="dlg">' +
        '<h2 id="ctitle">Pengesahan</h2><p>' + esc(message) + '</p>' +
        '<div class="acts"><button class="btn d" id="cyes">' + esc(okLabel || 'Ya, teruskan') + '</button><button class="btn o" id="cno">Batal</button></div></div></div>';
      function done(v) { box.innerHTML = ''; document.removeEventListener('keydown', onKey, true); resolve(v); }
      function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); done(false); } }
      document.addEventListener('keydown', onKey, true);
      $('#cyes').addEventListener('click', function () { done(true); });
      $('#cno').addEventListener('click', function () { done(false); });
      $('#cno').focus();
    });
  }

  // ------------------------------------------------------------------ rangka
  function render() {
    if (S.login) { renderLogin(); return; }

  // Pengurai CSV (pembatas , atau ; dikesan daripada baris pertama; sokong petikan dan baris baharu dalam sel)
  function parseCsv(text) {
    text = String(text || '').replace(/^﻿/, '');
    var first = text.split(/\r?\n/)[0] || '';
    var delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
    var rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function normCell(f, raw) {
    var v = String(raw === undefined || raw === null ? '' : raw).trim(), m, lo;
    if (v === '') return '';
    function p2(n) { return ('0' + n).slice(-2); }
    function y4(y) { y = parseInt(y, 10); return y < 100 ? 2000 + y : y; }
    if (f.type === 'date') {
      if ((m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/.exec(v))) return y4(m[3]) + '-' + p2(m[2]) + '-' + p2(m[1]);
      if ((m = /^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/.exec(v)) || (m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v))) return m[1] + '-' + p2(m[2]) + '-' + p2(m[3]);
    } else if (f.type === 'month') {
      if ((m = /^(\d{1,2})[\/.-](\d{4})$/.exec(v))) return m[2] + '-' + p2(m[1]);
      if ((m = /^(\d{4})[\/.-](\d{1,2})$/.exec(v))) return m[1] + '-' + p2(m[2]);
      if ((m = /^\d{1,2}[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(v))) return m[2] + '-' + p2(m[1]);
      if ((m = /^(\d{4})-(\d{1,2})-\d{1,2}$/.exec(v))) return m[1] + '-' + p2(m[2]);
    } else if (f.type === 'number') {

  function readBulkFile(k, file) {

    var rd = new FileReader();
    rd.onload = function () {
      var all = parseCsv(String(rd.result)), fs = bulkFields(k), b = { kpiId: k.id, file: file.name, rows: [], problems: [], raws: {}, headers: [] };
      var hi = -1;
      for (var i = 0; i < all.length; i++) { if (all[i].some(function (c) { return String(c).trim() !== ''; }) && String(all[i][0]).trim().charAt(0) !== '#') { hi = i; break; } }
      if (hi < 0) { b.problems.push('Fail kosong.'); S.bulk = b; renderBulk(k); return; }
      var cols = all[hi].map(function (h) { var m = /\[([A-Za-z0-9_]+)\]\s*$/.exec(String(h)); return m ? m[1] : String(h).trim(); });
      var byKey = {}; fs.forEach(function (f) { byKey[f.key] = f; });
      var known = cols.filter(function (c) { return byKey[c]; });
      b.headers = cols;
      fs.filter(function (f) { return f.required && cols.indexOf(f.key) < 0; }).forEach(function (f) { b.problems.push('Lajur wajib tiada: ' + f.label + ' [' + f.key + ']'); });
      cols.filter(function (c) { return !byKey[c]; }).forEach(function (c) { b.problems.push('Lajur tidak dikenali (diabaikan): ' + c); });
      for (var r = hi + 1; r < all.length; r++) {
        var cells = all[r];
        if (!cells.some(function (c) { return String(c).trim() !== ''; }) || String(cells[0]).trim().charAt(0) === '#') continue;
        var rec = {};
        cols.forEach(function (c, j) { if (byKey[c]) { var v = normCell(byKey[c], cells[j]); if (v !== '' && !(Array.isArray(v) && !v.length)) rec[c] = v; } });
        b.rows.push({ n: r + 1, rec: rec }); b.raws[r + 1] = cells;
      }
      if (b.rows.length > BULK_MAX_ROWS) { b.problems.push('Terlalu banyak baris (' + b.rows.length + '). Maksimum ' + BULK_MAX_ROWS + ' baris setiap muat naik.'); b.rows = []; }

  // Teks bernombor "1. NAMA (NO. MATRIK)" setiap baris -> senarai {nama, matrik}
  function parseNumbered(v) {
    return String(v || '').split(/\r?\n/).map(function (ln) {
      var m = /^\s*\d+\.\s*(.*?)\s*\(([^()]+)\)\s*$/.exec(ln);
      return m ? { nama: m[1], matrik: m[2] } : null;
    }).filter(Boolean);
  }
  // Susunan borang: KPI berdata pelajar meletakkan No. matrik di atas, diikuti medan auto (nama, no. KP, fakulti) daripada PELAJAR.
  function formFields(k) {
    if (!k.student) return k.fields;
    var fs = k.fields.map(function (f) { return Object.assign({}, f); });
    var mk = fs.filter(function (f) { return f.key === k.student.matrik; })[0];
    if (!mk) return k.fields;
    var first = fs[0] !== mk ? fs[0] : null;
    if (!mk.sec && first && first.sec) { mk.sec = first.sec; first.sec = undefined; }
    var rest = fs.filter(function (f) { return f !== mk; }), order = ['nama_pelajar', 'no_kp', 'fakulti'];
    var autos = rest.filter(function (f) { return f.derived && f.autoShow; }).sort(function (a, b) { return order.indexOf(a.autoShow) - order.indexOf(b.autoShow); });
    var others = rest.filter(function (f) { return autos.indexOf(f) < 0; });
    return [mk].concat(autos, others);
  }
  function renderForm(k) {
    var rec = S.editing || {};
    S.people = {}; S.files = {}; S.peopleKp = {};
    k.fields.forEach(function (fd) {
      if (fd.type === 'people') { S.peopleKp[fd.key] = fd.kp !== false; var ps = fd.format === 'numbered' ? parseNumbered(rec[fd.key]) : parseJson(rec[fd.key], []); S.people[fd.key] = ps.length ? ps.map(function (p) { return { nama: p.nama || '', matrik: p.matrik || '', nokp: p.nokp || '', fakulti: p.fakulti || '' }; }) : [{ nama: '', matrik: '', nokp: '', fakulti: '' }]; }
      if (fd.type === 'file') { var f = parseJson(rec[fd.key], null); S.files[fd.key] = f && f.id ? f : null; }
    });
    var h = '<form class="form" id="kform" novalidate><div class="fgrid">';
    formFields(k).forEach(function (fd) {
      if (fd.hidden || (fd.derived && !fd.autoShow)) return;
      if (fd.sec) h += '<div class="fsec">' + esc(fd.sec) + '</div>';
      h += '<div class="' + (fd.full ? 'full' : '') + '" data-field="' + fd.key + '"><label for="f_' + fd.key + '">' + esc(fd.label) + (fd.required ? ' <span class="req" aria-hidden="true">*</span>' : '') + '</label>' +
        inputFor(k, fd, (!S.editing && rec[fd.key] === undefined && fd.def !== undefined) ? fd.def : rec[fd.key]) +
        (k.student && fd.key === k.student.matrik ? '<div class="stu" id="stu_status" aria-live="polite">' + (S.editing && rec[k.student.nama] ? '✓ ' + esc(rec[k.student.nama]) : '') + '</div>' : '') +
        (fd.hint ? '<div class="hint">' + esc(fd.hint) + '</div>' : '') + '<div class="err" role="alert"></div></div>';
    });
    h += '</div><div class="acts"><button class="btn" type="submit" id="savebtn">Simpan</button>' +
      '<button class="btn o" type="button" data-action="cancelform">Batal</button></div></form>';
    $('#content').innerHTML = h;
    initAutofill(k);
  }

  // Isi automatik medan (contoh: no. chargeline) apabila medan sumber (contoh: nama tabung) dipilih; medan dikunci jika ada padanan.
  function applyAutofill(k, srcKey) {
    k.fields.forEach(function (fd) {
      if (fd.autoFrom !== srcKey || !fd.autoMap) return;
      var src = document.getElementById('f_' + srcKey), el = document.getElementById('f_' + fd.key);
      if (!src || !el) return;
      var mapped = fd.autoMap[src.value];
      if (mapped) { el.value = mapped; el.readOnly = true; el.classList.add('ro'); }
      else { if (el.readOnly) el.value = ''; el.readOnly = false; el.classList.remove('ro'); }
    });
  }
  function initAutofill(k) { k.fields.forEach(function (fd) { if (fd.autoFrom) applyAutofill(k, fd.autoFrom); }); }

  function collectForm(k) {
    var rec = {};
    if (S.editing) rec.id = S.editing.id;
    k.fields.forEach(function (fd) {
      if (fd.type === 'people') { syncPeople(fd.key); rec[fd.key] = (S.people[fd.key] || []).filter(function (p) { return p.matrik; }).map(function (p) { return { matrik: p.matrik }; }); return; }
      if (fd.type === 'file') { rec[fd.key] = S.files[fd.key] || ''; return; }
      if (fd.derived) return;   // diisi automatik oleh pelayan daripada PELAJAR
      var el = document.getElementById('f_' + fd.key);
      if (!el) return;
      if (el.disabled && fd.key === 'fakulti') { rec[fd.key] = S.session.user.fakulti; return; }
      rec[fd.key] = el.value;
    });
    return rec;
  }
  function showFieldErrors(fields) {

    var h = '<div class="panel"><table><thead><tr><th>Masa</th><th>Pengguna</th><th>Tindakan</th><th>KPI</th><th>Rekod</th><th>Ringkasan</th></tr></thead><tbody>';

  // ------------------------------------------------------------------ infografik (awam)
  var MS = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
  var COL = { m: '#5c0f2a', gold: '#e9b949', kpt: '#b8860b', teal: '#1f6f6b', track: '#efe6e9', mut: '#6a5a5f' };
  var gradN = 0;
  function monthShort(l) { var m = /^\d{4}-(\d{2})/.exec(String(l)); return m ? MS[parseInt(m[1], 10) - 1] : String(l); }
  function isMeet(c) { return c.status === 'Capai sasaran' || c.status === 'Melebihi sasaran' || c.status === 'Selesai'; }
  function pctCap(c) { return c.pct === null || c.pct === undefined ? null : Math.min(100, c.pct); }

  // Cincin kemajuan; o.tick = penanda sasaran (0-100)
  function ringSvg(pct, o) {
    var size = o.size || 120, cx = size / 2, r = size / 2 - 10, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct || 0));
    var h = '<svg class="ring" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="' + esc(o.label + ': ' + o.text) + '">' +
      '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + COL.track + '" stroke-width="9"/>' +
      '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + (o.color || COL.m) + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (c * p / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cx + ')"><title>' + esc(o.label + ': ' + o.text) + '</title></circle>';
    if (o.tick) {
      var a = (o.tick / 100 * 360 - 90) * Math.PI / 180;
      h += '<line x1="' + (cx + (r - 8) * Math.cos(a)).toFixed(1) + '" y1="' + (cx + (r - 8) * Math.sin(a)).toFixed(1) + '" x2="' + (cx + (r + 8) * Math.cos(a)).toFixed(1) + '" y2="' + (cx + (r + 8) * Math.sin(a)).toFixed(1) + '" stroke="' + COL.gold + '" stroke-width="3" stroke-linecap="round"><title>Sasaran ' + o.tick + '%</title></line>';
    }
    return h + '<text x="' + cx + '" y="' + (cx + size * 0.07) + '" text-anchor="middle" class="rv" style="font-size:' + Math.round(size * 0.22 * (String(o.text).length > 5 ? Math.max(0.62, 5 / String(o.text).length) : 1)) + 'px">' + esc(o.text) + '</text></svg>';
  }
  function ringTile(pct, o) {
    return '<div class="rtile">' + ringSvg(pct, o) + '<b>' + esc(o.label) + '</b>' + (o.en ? '<i>(' + esc(o.en) + ')</i>' : '') + (o.sub ? '<small>' + esc(o.sub) + '</small>' : '') + '</div>';
  }

  // Carta bar menegak (satu paksi); item = {label, value}
  function barsSvg(items, o) {
    o = o || {};
    var W = 320, H = 140, pl = 6, pb = 20, pt = 16, n = items.length, max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
    var slot = (W - pl * 2) / n, bw = Math.min(24, slot - 6), h = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Carta bar') + '">' +
      '<line x1="' + pl + '" y1="' + (H - pb) + '" x2="' + (W - pl) + '" y2="' + (H - pb) + '" stroke="#d9cdd1" stroke-width="1"/>';
    var peak = items.reduce(function (m, i, k) { return i.value > items[m].value ? k : m; }, 0);
    items.forEach(function (it, k) {
      var bh = Math.max(2, (H - pb - pt) * it.value / max), x = pl + slot * k + (slot - bw) / 2, y = H - pb - bh, rr = Math.min(4, bw / 2);
      h += '<path d="M' + x + ' ' + (H - pb) + 'V' + (y + rr) + 'a' + rr + ' ' + rr + ' 0 0 1 ' + rr + ' -' + rr + 'h' + (bw - 2 * rr) + 'a' + rr + ' ' + rr + ' 0 0 1 ' + rr + ' ' + rr + 'V' + (H - pb) + 'z" fill="' + (k === peak ? COL.m : '#a0577a') + '"><title>' + esc(it.label + ': ' + (o.fmt ? o.fmt(it.value) : fmtNum(it.value))) + '</title></path>' +
        '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" class="ax">' + esc(monthShort(it.label)) + '</text>';
      if (k === peak) h += '<text x="' + (x + bw / 2) + '" y="' + (y - 4) + '" text-anchor="middle" class="av">' + esc(o.fmt ? o.fmt(it.value) : fmtNum(it.value)) + '</text>';
    });
    return h + '</svg>';
  }

  // Carta kawasan/garis (satu paksi); o.target = garis sasaran melintang
  function areaSvg(items, o) {
    o = o || {};
    var W = 320, H = 140, pl = 14, pr = 14, pb = 20, pt = 18, n = items.length;
    var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([o.target || 0, 1])) * 1.1;
    function X(k) { return n === 1 ? W / 2 : pl + (W - pl - pr) * k / (n - 1); }
    function Y(v) { return H - pb - (H - pb - pt) * v / max; }
    var id = 'ag' + (++gradN), pts = items.map(function (it, k) { return X(k).toFixed(1) + ' ' + Y(it.value).toFixed(1); });
    var h = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Carta') + '"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + COL.m + '" stop-opacity=".28"/><stop offset="1" stop-color="' + COL.m + '" stop-opacity="0"/></linearGradient></defs>' +
      '<line x1="' + pl + '" y1="' + (H - pb) + '" x2="' + (W - pr) + '" y2="' + (H - pb) + '" stroke="#d9cdd1"/>';
    if (o.target) h += '<line x1="' + pl + '" y1="' + Y(o.target).toFixed(1) + '" x2="' + (W - pr) + '" y2="' + Y(o.target).toFixed(1) + '" stroke="' + COL.gold + '" stroke-width="2" stroke-dasharray="5 4"><title>' + esc(o.targetLabel || 'Sasaran') + '</title></line>' +
      '<text x="' + (W - pr) + '" y="' + (Y(o.target) - 5).toFixed(1) + '" text-anchor="end" class="av">' + esc(o.targetLabel || 'Sasaran') + '</text>';
    if (n > 1) h += '<path d="M' + pts.join('L') + 'L' + X(n - 1).toFixed(1) + ' ' + (H - pb) + 'L' + X(0).toFixed(1) + ' ' + (H - pb) + 'z" fill="url(#' + id + ')"/>';
    h += '<path d="M' + pts.join('L') + '" fill="none" stroke="' + COL.m + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    items.forEach(function (it, k) {
      h += '<circle cx="' + X(k).toFixed(1) + '" cy="' + Y(it.value).toFixed(1) + '" r="4" fill="' + COL.m + '" stroke="#fff" stroke-width="2"><title>' + esc(it.label + ': ' + (o.fmt ? o.fmt(it.value) : fmtNum(it.value))) + '</title></circle>' +
        '<text x="' + X(k).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" class="ax">' + esc(o.xlabel ? o.xlabel(it.label) : monthShort(it.label)) + '</text>';
    });
    if (o.valueLabels) items.forEach(function (it, k) { h += '<text x="' + X(k).toFixed(1) + '" y="' + (Y(it.value) - 8).toFixed(1) + '" text-anchor="middle" class="av">' + esc(o.fmt ? o.fmt(it.value) : fmtNum(it.value)) + '</text>'; });
    return h + '</svg>';
  }

  function hbarsHtml(items, fmt, limit) {

    }).join('');

  function bdOf(c, re) { var b = (c && c.breakdown || []).filter(function (x) { return re.test(x.title) && x.items.length; })[0]; return b ? b.items : null; }
  function panel(title, body, cls) { return '<section class="igp ' + (cls || '') + '"><h3 class="igt">' + esc(title) + '</h3>' + body + '</section>'; }

  function loadInfo(year) {

  // % Penggunaan Tabung: satu cincin bagi setiap tabung; nilai % di tengah, kod tabung dan RM dibelanjakan di bawah (peruntukan tidak didedahkan kepada awam).
  var TB_COLORS = ['#5c0f2a', '#1f6f6b', '#a0577a', '#b8860b', '#6a8caf', '#8a1c46', '#3b78d8', '#7a6a2f'];
  function tabungRingsHtml(tb, size) {

  function msUsersHtml(c, items) {

  // Kandungan panel KPT (tiga Teras; cincin setiap KPI). Digunakan oleh Infografik dan slaid 2.
  function kptTerasHtml(d, cs) {

    function avgPct(list) { var v = list.map(pctCap).filter(function (x) { return x !== null; }); return v.length ? Math.round(v.reduce(function (a, b) { return a + b; }, 0) / v.length) : null; }
    var h = '<div class="igtop"><div><h2 class="igh">Laporan Prestasi UTMXCITE</h2><p class="igs">' + esc(d.ds.label) + ' · tahun ' + esc(d.year) + ' · data ringkasan, tiada maklumat peribadi</p></div>' +
      '<div class="igctl"><label for="iy" style="margin:0">Tahun</label><select id="iy" data-change="iyear">' + d.years.map(function (y) { return '<option' + (y === d.year ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>' +
      '<button class="btn sm pbtn" type="button" data-action="slides" title="Cetak / simpan PDF slaid 16:9 untuk pembentangan">Cetak slide</button> <button class="btn o sm pbtn" type="button" data-action="print" title="Cetak halaman Infografik">Cetak halaman</button></div></div><div class="ig">';

    h += panel('Pekerjaan Premium Tier 1', '<div class="prem2">' + ringSvg(pr.pct, { size: 150, label: 'Usahawan berpendapatan premium', text: pr.pct + '%', tick: pr.targetPct }) +
      '<div class="pt"><b>' + pr.premium + ' / ' + pr.total + '</b><span>usahawan dengan purata pendapatan sebulan melebihi RM' + String(pr.thresholdRm).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '</span>' +

    var tb = byId.CKAI10;

    // 5) Enam fungsi
    h += panel('Enam fungsi UTMXCITE', '<div class="rrow six">' + d.functions.filter(function (f) { return f.no; }).map(function (f) {
      var list = cs.filter(function (c) { return c.fungsi === f.id; }), t = list.filter(function (c) { return c.target !== ''; }), p = avgPct(t);

    }).join('') + '</div>', 'c12');

    // 7) Baris 1: pendapatan usahawan mengikut bulan + mengikut fakulti; baris 2: Makerspace mengikut bulan + mengikut peralatan; baris 3: sewaan, SSU, profiling
    var inc = bdOf(byId.CKAI7, /bulan/i), rent = bdOf(byId.CKAI6, /bulan/i), ms = bdOf(byId.CKAI5, /bulan/i), incFak = bdOf(byId.CKAI7, /fakulti/i);

      (L.message ? '<div class="ok" role="status">' + esc(L.message) + '</div>' : '') +
      '<div class="err" role="alert">' + esc(L.error || '') + '</div>' +
      '<div class="lgacts"><button class="btn" type="button" data-action="sendotp"' + (L.busy ? ' disabled' : '') + '>' + (L.busy === 'send' ? 'Menghantar…' : 'Hantar / Hantar Semula Kod') + '</button>' +
      '<button class="btn" type="submit"' + (L.busy ? ' disabled' : '') + '>' + (L.busy === 'verify' ? 'Mengesahkan…' : 'Sahkan dan Log Masuk') + '</button></div>' +
      '<p class="lgback"><a href="#" data-action="lclose">← Kembali ke dashboard awam</a></p></form></div></main>' +
      '<footer class="lgfoot">© 2026 UTMXCITE, Universiti Teknologi Malaysia</footer></div>';
    var f = (L.message && $('#l_code')) || $('#l_emel'); if (f && !L.noFocus) f.focus();
  }
  function loginKeep() {   // simpan nilai medan sebelum lukis semula
    var L = S.login; if (!L) return;
    if ($('#l_emel')) L.email = $('#l_emel').value.trim();
    if ($('#l_code')) L.code = $('#l_code').value.trim();
  }

  function sendOtp() {
    var L = S.login; if (!L || L.busy) return;
    loginKeep(); L.error = ''; L.message = '';
    if (!L.email) { L.error = 'Sila masukkan e-mel.'; renderLogin(); return; }
    L.busy = 'send'; renderLogin();
    call('api_requestOtp', L.email).then(function (r) {
      L.busy = false; L.message = r.message || 'Kod OTP telah dihantar.'; renderLogin();
    }).catch(function (e) { L.busy = false; L.error = e.message; renderLogin(); });
  }

  function submitLogin() {
    var L = S.login; if (!L || L.busy) return;
    loginKeep(); L.error = '';
    if (!L.email) { L.error = 'Sila masukkan e-mel.'; renderLogin(); return; }
    if (!/^\d{6}$/.test(L.code || '')) { L.error = L.message ? 'Masukkan kod 6 digit.' : 'Tekan "Hantar Kod" dahulu, kemudian masukkan kod 6 digit.'; renderLogin(); return; }
    L.busy = 'verify'; renderLogin();
    call('api_verifyOtp', L.email, L.code).then(function (r) {
      S.token = r.token; store('set', 'utmx_token', r.token);
      S.login = null;
      return call('api_session', S.token);
    }).then(function (sess) {
      S.session = sess; S.view = { name: 'infografik' }; S.dash = null;
      toast('Selamat datang, ' + (sess.user.nama || sess.user.emel) + '.');
      render();
    }).catch(function (e) { L.busy = false; L.error = e.message; L.code = ''; renderLogin(); });
  }

  function doLogout() {
    var t = S.token;
    S.token = null; S.session = null; store('del', 'utmx_token');
    S.view = { name: 'infografik' }; S.list = S.users = S.targets = S.audit = null; S.editing = null; S.dash = null;
    if (t) call('api_logout', t).catch(function () {});
    toast('Anda telah log keluar.');
    render();
  }

  // ------------------------------------------------------------------ navigasi
  function go(target) {
    S.navOpen = false; S.editing = null; S.list = null; S.listFilters = {};
    var lvl = levelOf(target); if (lvl) S.open[lvl] = true;
    if (target === 'infografik') { S.view = { name: 'infografik' }; S.trend = null; S.dash = null; }
    else if (target === 'dashboard') { S.view = { name: 'dashboard' }; S.dash = null; } // muat semula supaya angka terkini dipaparkan
    else if (target.indexOf('kpi:') === 0) S.view = { name: 'kpi', id: target.slice(4), tab: 'list' };
    else { S.view = { name: target }; if (target === 'users') S.users = null; if (target === 'targets') S.targets = null; if (target === 'audit') S.audit = null; if (target === 'setup') S.setup = null; }
    render(); window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------------ peristiwa
  document.addEventListener('click', function (ev) {
    var nav = ev.target.closest('[data-nav]');
    if (nav) { go(nav.getAttribute('data-nav')); return; }
    var a = ev.target.closest('[data-action]');
    if (!a) return;
    var act = a.getAttribute('data-action');
    var k = S.view.name === 'kpi' ? kpiById(S.view.id) : null;
    switch (act) {
      case 'togglenav': S.navOpen = !S.navOpen; $('#side').classList.toggle('open', S.navOpen); $('.scrim').classList.toggle('open', S.navOpen); break;
      case 'tg':
        var gid = a.getAttribute('data-g');
        if (S.mini) { S.mini = false; S.open[gid] = true; } else S.open[gid] = !isOpen(gid);
        redrawSide(); break;
      case 'collapse':
        if (window.innerWidth <= 860) { S.navOpen = false; $('#side').classList.remove('open'); $('.scrim').classList.remove('open'); }
        else { S.mini = !S.mini; redrawSide(); }
        break;
      case 'closenav': S.navOpen = false; $('#side').classList.remove('open'); $('.scrim').classList.remove('open'); break;
      case 'login': S.login = { email: '' }; renderLogin(); break;
      case 'sendotp': sendOtp(); break;
      case 'lclose': ev.preventDefault(); S.login = null; render(); break;
      case 'logout': doLogout(); break;
      case 'dview': S.dashView = a.getAttribute('data-view'); renderDashboard(); break;
      case 'padd':
        var pk = a.getAttribute('data-key'), pfd = k && fieldDef(k, pk);
        syncPeople(pk);
        if (!S.people[pk]) S.people[pk] = [];
        if (pfd && pfd.max && S.people[pk].length >= pfd.max) { toast('Maksimum ' + pfd.max + ' ' + (pfd.noun || 'pelajar') + '.', true); break; }
        S.people[pk].push({ nama: '', matrik: '', nokp: '', fakulti: '' }); redrawPeople(pk); break;
      case 'pdel': syncPeople(a.getAttribute('data-key')); S.people[a.getAttribute('data-key')].splice(parseInt(a.getAttribute('data-i'), 10), 1); redrawPeople(a.getAttribute('data-key')); break;
      case 'fdl': if (k) downloadPdf(k, a.getAttribute('data-id'), a.getAttribute('data-key')); break;
      case 'tab': S.view.tab = a.getAttribute('data-tab'); if (S.view.tab === 'list') S.editing = null; renderKpi(); break;
      case 'msync': runMsync(); break;
      case 'stucancel': S.modal = null; drawStudentModal(); break;
      case 'bulkstu': bulkCompleteStudents(kpiById(S.view.id)); break;
      case 'bulkdl': downloadTemplate(kpiById(S.view.id)); break;
      case 'bulkgo': runBulk(kpiById(S.view.id)); break;
      case 'bulkerr': downloadBulkErrors(kpiById(S.view.id)); break;
      case 'bulkreset': S.bulk = null; renderKpi(); break;
      case 'new': S.editing = null; S.view.tab = 'form'; renderKpi(); break;
      case 'cancelform': S.editing = null; S.view.tab = 'list'; renderKpi(); break;
      case 'edit':
        S.editing = (S.list.rows.filter(function (r) { return r.id === a.getAttribute('data-id'); })[0]) || null;
        S.view.tab = 'form'; renderKpi(); window.scrollTo(0, 0); break;
      case 'del':
        if (k) {
          var rid = a.getAttribute('data-id');
          askConfirm('Padam rekod ' + rid + '? Tindakan ini tidak boleh dibatalkan.', 'Ya, padam').then(function (yes) {
            if (!yes) return;
            call('api_delete', S.token, k.id, rid).then(function () { toast('Rekod dipadam.'); S.list = null; renderList(k); })
              .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
          });
        }
        break;
      case 'uedit':
        var u = S.users.filter(function (x) { return x.emel === a.getAttribute('data-email'); })[0];
        if (u) {
          $('#u_emel').value = u.emel; $('#u_nama').value = u.nama; $('#u_peranan').value = u.peranan;
          $('#u_fakulti').value = u.fakulti; $('#u_akses').value = u.kpi_akses; $('#u_aktif').value = u.aktif;
          window.scrollTo(0, 0);
        }
        break;
      case 'uclear': $('#uform').reset(); break;
      case 'copy': copyText(a.getAttribute('data-v')); break;
      case 'logoutall':
        askConfirm('Log keluar daripada SEMUA peranti dan pelayar? Anda perlu OTP baharu untuk log masuk semula.', 'Ya, log keluar semua').then(function (yes) {
          if (!yes) return;
          call('api_logoutAll', S.token).then(function () { S.token = null; S.session = null; store('del', 'utmx_token'); doLogout(); }).catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        });
        break;
      case 'slides': printSlides(); break;
      case 'print':   // tajuk dokumen (dan nama fail PDF) = Laporan Prestasi UTMXCITE
        var oldTitle = document.title; document.title = 'Laporan Prestasi UTMXCITE' + (S.dash ? ' ' + S.dash.year : '');
        window.print(); document.title = oldTitle; break;
      case 'runsetup':
        askConfirm('Jalankan persediaan semula? Tab/lajur yang tiada akan ditambah; data sedia ada tidak dipadam.', 'Ya, jalankan').then(function (yes) {
          if (!yes) return;
          call('api_runSetup', S.token).then(function () { toast('Persediaan selesai.'); S.setup = null; renderSetup(); })
            .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        });
        break;
      case 'testmail':
        call('api_testMail', S.token).then(function (r) { toast('E-mel ujian dihantar ke ' + r.to + '.'); })
          .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        break;
      case 'udel':
        var em = a.getAttribute('data-email');
        askConfirm('Padam pengguna ' + em + '?', 'Ya, padam').then(function (yes) {
          if (!yes) return;
          call('api_deleteUser', S.token, em).then(function () { toast('Pengguna dipadam.'); S.users = null; renderUsers(); })
            .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        });
        break;
      case 'tsave':
        var i = parseInt(a.getAttribute('data-i'), 10), t = S.targets[i], row = { kpi: t.kpi, tahun: t.tahun };
        $$('[data-t="' + i + '"]').forEach(function (inp) { row[inp.getAttribute('data-k')] = inp.value; });
        call('api_saveTarget', S.token, row).then(function () { toast('Sasaran ' + t.kpi + ' ' + t.tahun + ' disimpan.'); S.dash = null; S.targets = null; renderTargets(); })
          .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        break;
    }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var id = ev.target.id;
    if (id === 'kform') submitForm();
    else if (id === 'stuform') saveStudentModal();
    else if (id === 'lform') submitLogin();
    else if (id === 'uform') {
      var rec = { emel: $('#u_emel').value, nama: $('#u_nama').value, peranan: $('#u_peranan').value, fakulti: $('#u_fakulti').value, kpi_akses: $('#u_akses').value, aktif: $('#u_aktif').value };
      call('api_saveUser', S.token, rec).then(function () { toast('Pengguna disimpan.'); S.users = null; renderUsers(); })
        .catch(function (e) { if (authFail(e)) return; showFieldErrors(e.fields); toast(e.message, true); });
    }
  });

  document.addEventListener('change', function (ev) {
    if (ev.target.id && ev.target.id.indexOf('f_') === 0 && S.view.name === 'kpi') { var ak = kpiById(S.view.id); if (ak) applyAutofill(ak, ev.target.id.slice(2)); }
    var tg = ev.target, kk2 = S.view.name === 'kpi' ? kpiById(S.view.id) : null;
    if (kk2 && ((kk2.student && tg.id === 'f_' + kk2.student.matrik) || tg.getAttribute('data-pf') === 'matrik')) { onMatrikChange(kk2, tg); }
    var c = ev.target.getAttribute && ev.target.getAttribute('data-change');
    if (!c) return;
    if (c === 'fupload') { var kk = kpiById(S.view.id); if (kk) uploadPdf(kk, ev.target.getAttribute('data-key'), ev.target.files && ev.target.files[0]); return; }
    if (c === 'bulkfile') { var bk = kpiById(S.view.id); if (bk) readBulkFile(bk, ev.target.files && ev.target.files[0]); return; }
    if (c === 'year') { S.dash = null; loadDashboard(parseInt(ev.target.value, 10)); }
    if (c === 'iyear') { S.dash = null; loadInfo(parseInt(ev.target.value, 10)); }
    if (c === 'fstatus') { S.listFilters.status = ev.target.value; S.list = null; renderKpi(); }
    if (c === 'fstatus2') { S.listFilters.status2 = ev.target.value; S.list = null; renderKpi(); }
    if (c === 'ffak') { S.listFilters.fakulti = ev.target.value; S.list = null; renderKpi(); }
  });

  var qTimer = null;
  document.addEventListener('input', function (ev) {
    if (ev.target.getAttribute && ev.target.getAttribute('data-input') === 'q') {
      var val = ev.target.value;
      clearTimeout(qTimer);
      qTimer = setTimeout(function () {
        S.listFilters.q = val; S.list = null; var k = kpiById(S.view.id);
        if (k) { call('api_list', S.token, k.id, S.listFilters).then(function (r) { S.list = r; var el = $('#q'); var pos = el ? el.selectionStart : 0; renderList(k); el = $('#q'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }); }
      }, 300);
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (S.login) { S.login = null; render(); }
      else if (S.navOpen) { S.navOpen = false; render(); }
    }
  });

  // ------------------------------------------------------------------ mula
  function boot() {
    var t = store('get', 'utmx_token');
    if (!t) { render(); return; }
    S.token = t;
    call('api_session', t).then(function (sess) { S.session = sess; render(); })
      .catch(function () { S.token = null; store('del', 'utmx_token'); render(); });
  }
  boot();
})();
</script>
</body>
</html>
